{{- if include "n8n-sandbox-service.runnerEnabled" . }}
{{- $runner := fromYaml (include "n8n-sandbox-service.runnerValues" .) -}}
{{- $component := include "n8n-sandbox-service.runnerComponent" . -}}
{{- $runnerRegistration := .Values.tls.certificates.runnerRegistrationClient -}}
{{- $runnerControl := .Values.tls.certificates.runnerControlServer -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "n8n-sandbox-service.runnerName" . }}
  labels:
    {{- include "n8n-sandbox-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  serviceName: {{ include "n8n-sandbox-service.runnerName" . }}
  replicas: {{ $runner.replicaCount }}
  selector:
    matchLabels:
      {{- include "n8n-sandbox-service.selectorLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "n8n-sandbox-service.selectorLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" $component) | nindent 8 }}
      {{- if or .Values.podAnnotations $runner.podAnnotations }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $runner.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $runner.runtime.runtimeClassName }}
      runtimeClassName: {{ $runner.runtime.runtimeClassName | quote }}
      {{- end }}
      {{- if kindIs "bool" $runner.runtime.hostUsers }}
      hostUsers: {{ $runner.runtime.hostUsers }}
      {{- end }}
      containers:
        - name: runner
          image: "{{ $runner.image.repository }}:{{ $runner.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ $runner.image.pullPolicy }}
          {{- if $runner.runtime.privileged }}
          securityContext:
            # dind runs the inner Docker daemon under the node's own runtime, so
            # the kernel capabilities have to come from here. Under sysbox they
            # come from the runtime instead and this stays false: setting both
            # would hand the container the very privileges sysbox exists to
            # withhold.
            privileged: true
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $runner.service.httpPort }}
            - name: control-grpc
              containerPort: {{ $runner.service.controlGrpcPort }}
          envFrom:
            - configMapRef:
                name: {{ include "n8n-sandbox-service.runnerName" . }}-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SANDBOX_RUNNER_ID
              value: "$(POD_NAME)"
            - name: SANDBOX_RUNNER_API_GRPC_ADDR
              value: "{{ include "n8n-sandbox-service.apiName" . }}:{{ .Values.api.service.grpcPort }}"
            - name: SANDBOX_RUNNER_HTTP_BASE_URL
              value: "http://$(POD_NAME).{{ include "n8n-sandbox-service.runnerName" . }}.$(POD_NAMESPACE).svc.cluster.local:{{ $runner.service.httpPort }}"
            - name: SANDBOX_RUNNER_CONTROL_GRPC_ADVERTISE_ADDR
              value: "$(POD_NAME).{{ include "n8n-sandbox-service.runnerName" . }}.$(POD_NAMESPACE).svc.cluster.local:{{ $runner.service.controlGrpcPort }}"
            - name: SANDBOX_RUNNER_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ include "n8n-sandbox-service.authSecretName" . }}
                  key: {{ .Values.auth.secretKeys.runnerApiKeys }}
            - name: SANDBOX_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "n8n-sandbox-service.authSecretName" . }}
                  key: {{ .Values.auth.secretKeys.runnerRegistrationToken }}
            - name: SANDBOX_RUNNER_REGISTRATION_GRPC_CA_FILE
              value: {{ printf "%s/%s" $runnerRegistration.mountPath $runnerRegistration.caFileKey | quote }}
            - name: SANDBOX_RUNNER_REGISTRATION_GRPC_CERT_FILE
              value: {{ printf "%s/%s" $runnerRegistration.mountPath $runnerRegistration.certFileKey | quote }}
            - name: SANDBOX_RUNNER_REGISTRATION_GRPC_KEY_FILE
              value: {{ printf "%s/%s" $runnerRegistration.mountPath $runnerRegistration.keyFileKey | quote }}
            {{- if $runnerRegistration.serverName }}
            - name: SANDBOX_RUNNER_REGISTRATION_GRPC_SERVER_NAME
              value: {{ $runnerRegistration.serverName | quote }}
            {{- end }}
            - name: SANDBOX_RUNNER_CONTROL_GRPC_TLS_CERT_FILE
              value: {{ printf "%s/%s" $runnerControl.mountPath $runnerControl.certFileKey | quote }}
            - name: SANDBOX_RUNNER_CONTROL_GRPC_TLS_KEY_FILE
              value: {{ printf "%s/%s" $runnerControl.mountPath $runnerControl.keyFileKey | quote }}
            - name: SANDBOX_RUNNER_CONTROL_GRPC_TLS_CLIENT_CA_FILE
              value: {{ printf "%s/%s" $runnerControl.mountPath $runnerControl.caFileKey | quote }}
            {{- with $runner.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: runner-registration-tls
              mountPath: {{ $runnerRegistration.mountPath | quote }}
              readOnly: true
            - name: runner-control-tls
              mountPath: {{ $runnerControl.mountPath | quote }}
              readOnly: true
            {{- if $runner.dockerConfig.existingSecret }}
            - name: docker-config
              mountPath: {{ printf "%s/config.json" $runner.dockerConfig.mountPath | quote }}
              subPath: config.json
              readOnly: true
            {{- end }}
            {{- if or $runner.dockerDataRoot.persistence.enabled $runner.runtime.privileged }}
            - name: docker-data
              mountPath: /var/lib/docker
            {{- end }}
            {{- with $runner.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $runner.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- if and $runner.runtime.privileged (not $runner.dockerDataRoot.persistence.enabled) }}
        - name: docker-data
          emptyDir:
            sizeLimit: {{ $runner.dockerDataRoot.emptyDirSizeLimit | quote }}
        {{- end }}
        - name: runner-registration-tls
          secret:
            secretName: {{ $runnerRegistration.secretName }}
        - name: runner-control-tls
          secret:
            secretName: {{ $runnerControl.secretName }}
        {{- if $runner.dockerConfig.existingSecret }}
        - name: docker-config
          secret:
            secretName: {{ $runner.dockerConfig.existingSecret }}
            items:
              - key: {{ $runner.dockerConfig.configKey }}
                path: config.json
        {{- end }}
        {{- with $runner.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $runner.scheduling.nodeSelector }}
      nodeSelector:
        {{- range $key, $value := . }}
        {{- if ne $value nil }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
        {{- end }}
      {{- end }}
      {{- with $runner.scheduling.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $topologySpreadConstraints := list (dict "maxSkew" 1 "topologyKey" "kubernetes.io/hostname" "whenUnsatisfiable" "ScheduleAnyway") }}
      {{- if hasKey $runner.scheduling "topologySpreadConstraints" }}
      {{- $topologySpreadConstraints = $runner.scheduling.topologySpreadConstraints }}
      {{- end }}
      {{- with $topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        - {{- omit . "labelSelector" | toYaml | nindent 10 }}
          labelSelector:
            {{- if .labelSelector }}
            {{- toYaml .labelSelector | nindent 12 }}
            {{- else }}
            matchLabels:
              {{- include "n8n-sandbox-service.selectorLabels" (dict "Release" $.Release "Chart" $.Chart "Values" $.Values "component" $component) | nindent 14 }}
            {{- end }}
        {{- end }}
      {{- end }}
      {{- with $runner.scheduling.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if $runner.dockerDataRoot.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: docker-data
      spec:
        accessModes:
          {{- toYaml $runner.dockerDataRoot.persistence.accessModes | nindent 10 }}
        {{- if $runner.dockerDataRoot.persistence.storageClass }}
        storageClassName: {{ $runner.dockerDataRoot.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $runner.dockerDataRoot.persistence.size | quote }}
  {{- end }}
{{- end }}
