imagePullSecrets: []

commonLabels: {}
podAnnotations: {}

auth:
  # Set this to use a Secret created outside this chart.
  # When set, auth.generated is ignored.
  existingSecret: ""
  secretKeys:
    apiKeys: api-keys
    runnerRegistrationToken: runner-registration-token
    runnerApiKey: runner-api-key
    runnerApiKeys: runner-api-keys
  # Used only when existingSecret is empty.
  generated:
    apiKeys: changeme
    runnerRegistrationToken: changeme
    runnerApiKey: changeme
    runnerApiKeys: changeme

dataPlane:
  # sysbox   in-chart runner, isolation from the sysbox-runc node runtime.
  # dind     in-chart runner, privileged Docker-in-Docker. No node runtime to
  #          install, which is the only option on an immutable-rootfs distro
  #          (Talos, Flatcar, CoreOS) where sysbox cannot write containerd's
  #          config. Weaker isolation: a privileged container can see the node's
  #          cgroup tree, so it suits a namespace running your own code and not
  #          a shared or multi-tenant cluster.
  # external runner runs outside this chart; only the API is deployed.
  mode: sysbox

networkPolicy:
  enabled: false
  api:
    # Controls who can reach the public HTTP API port.
    # When empty, all sources are allowed so an existing ingress controller keeps working.
    httpIngressFrom: []
    # Additional peers allowed to reach the runner registration gRPC port.
    # The in-chart runner is allowed automatically when enabled.
    grpcIngressFrom: []
  runner:
    # Additional peers allowed to reach runner HTTP/control ports.
    # The in-chart API is allowed automatically.
    ingressFrom: []

monitoring:
  serviceMonitor:
    # Requires the Prometheus Operator ServiceMonitor CRD.
    enabled: false
    interval: 30s
    path: /metrics
    scheme: http
    api:
      enabled: true
    runner:
      enabled: true

tls:
  # Choose how the mTLS Secrets are provided: existingSecret or certManager.
  mode: existingSecret
  certManager:
    issuerRef:
      name: ""
      kind: Issuer
      group: cert-manager.io
    duration: 2160h
    renewBefore: 360h
    privateKey:
      rotationPolicy: Always
  certificates:
    apiRegistrationServer:
      secretName: n8n-sandbox-api-registration-tls
      mountPath: /tls/api-registration
      certFileKey: tls.crt
      keyFileKey: tls.key
      caFileKey: ca.crt
      dnsNames: []
    apiControlClient:
      secretName: n8n-sandbox-api-control-client-tls
      mountPath: /tls/api-control-client
      certFileKey: tls.crt
      keyFileKey: tls.key
      caFileKey: ca.crt
      serverName: ""
    runnerRegistrationClient:
      secretName: n8n-sandbox-runner-registration-tls
      mountPath: /tls/runner-registration
      certFileKey: tls.crt
      keyFileKey: tls.key
      caFileKey: ca.crt
      serverName: ""
    runnerControlServer:
      secretName: n8n-sandbox-runner-control-tls
      mountPath: /tls/runner-control
      certFileKey: tls.crt
      keyFileKey: tls.key
      caFileKey: ca.crt
      dnsNames: []

api:
  replicaCount: 1

  image:
    repository: n8nio/n8n-sandbox-service-api
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    httpPort: 8080
    grpcPort: 9090
    annotations: {}

  ingress:
    enabled: false
    className: traefik
    annotations: {}
    hosts:
      - host: sandbox.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []

  config:
    listenAddr: ":8080"
    grpcListenAddr: ":9090"
    store: sqlite
    dataDir: /tmp/sandbox-api
    maxFileBytes: "10485760"
    defaultMaxSandboxes: "50"
    enableCors: "false"
    runnerHeartbeatGrace: 45s
    idleStopAfter: 1h
    idleDeleteAfter: 24h
    idleDeleteSafetyBuffer: 1m
    idleSweepInterval: 1m

  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce

  resources: {}
  podSecurityContext:
    fsGroup: 100
    fsGroupChangePolicy: OnRootMismatch
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

sysboxRunner:
  enabled: true
  replicaCount: 1

  image:
    repository: n8nio/n8n-sandbox-service-runner-dind
    tag: latest
    pullPolicy: IfNotPresent

  sandboxImage:
    repository: n8nio/n8n-sandbox-service-sandbox
    tag: latest
    pullPolicy: IfNotPresent

  dockerConfig:
    existingSecret: ""
    configKey: .dockerconfigjson
    mountPath: /root/.docker

  dockerDataRoot:
    persistence:
      enabled: false
      size: 64Gi
      storageClass: ""
      accessModes:
        - ReadWriteOnce
    # Used only when persistence is disabled and the runtime needs its own
    # /var/lib/docker, which is the dind case. Sysbox gives the container a
    # writable one already.
    emptyDirSizeLimit: 20Gi

  service:
    annotations: {}
    httpPort: 8080
    controlGrpcPort: 9091

  runtime:
    runtimeClassName: sysbox-runc
    hostUsers: false
    # Must stay false here. Sysbox supplies the runner's privileges through the
    # node runtime; turning this on would grant the container exactly what
    # sysbox exists to withhold. Rendering fails if it is set.
    privileged: false

  scheduling:
    nodeSelector:
      sysbox-install: "yes"
    tolerations:
    - key: sysbox-runtime
      operator: Equal
      value: not-running
      effect: NoSchedule
    affinity: {}

  config:
    listenAddr: ":8080"
    controlGrpcListenAddr: ":9091"
    dockerHost: unix:///var/run/docker.sock
    dataDir: /var/sandboxes
    idleTtlSeconds: "3600"
    capacityTotal: "1000"
    maxFileBytes: "10485760"
    defaultMemoryMb: "512"
    defaultCpuPercent: "100"
    defaultPidsMax: "256"
    defaultDiskQuotaMb: "0"
    diskQuotaPoolSizeGb: ""
    diskQuotaPoolPath: ""
    enableCgroups: "true"
    dockerStorageDriver: ""
    dockerInsecureRegistries: ""

  resources: {}
  podAnnotations: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

# Used when dataPlane.mode is dind. Same runner image and the same config
# surface as sysboxRunner; the two differ only in where the container gets the
# privileges to run an inner Docker daemon, and in what that costs.
#
# The namespace has to permit privileged pods. Pod Security Admission denies
# them by default, and the rejection surfaces on the StatefulSet rather than as
# a failing pod, so it reads as nothing happening at all:
#
#   kubectl label namespace <ns> pod-security.kubernetes.io/enforce=privileged
dindRunner:
  enabled: true
  replicaCount: 1

  image:
    repository: n8nio/n8n-sandbox-service-runner-dind
    tag: latest
    pullPolicy: IfNotPresent

  sandboxImage:
    repository: n8nio/n8n-sandbox-service-sandbox
    tag: latest
    pullPolicy: IfNotPresent

  dockerConfig:
    existingSecret: ""
    configKey: .dockerconfigjson
    mountPath: /root/.docker

  dockerDataRoot:
    persistence:
      enabled: false
      size: 64Gi
      storageClass: ""
      accessModes:
        - ReadWriteOnce
    # Inner image layers land here. The default is deliberately not tiny: the
    # sandbox image alone is most of a gigabyte, and an evicted pod takes every
    # running sandbox with it.
    emptyDirSizeLimit: 20Gi

  service:
    annotations: {}
    httpPort: 8080
    controlGrpcPort: 9091

  runtime:
    # No RuntimeClass: the pod runs under whatever the node already has, which
    # is the whole point of this mode. Rendering fails if one is named.
    runtimeClassName: ""
    hostUsers: null
    # Required. Without it dockerd cannot create the namespaces a sandbox needs,
    # and the runner starts cleanly and then fails every sandbox it is asked for.
    privileged: true

  # No sysbox-install nodeSelector or sysbox-runtime toleration: any node can
  # run this, which is what makes it work on a cluster that has no such labels.
  scheduling:
    nodeSelector: {}
    tolerations: []
    affinity: {}

  config:
    listenAddr: ":8080"
    controlGrpcListenAddr: ":9091"
    dockerHost: unix:///var/run/docker.sock
    dataDir: /var/sandboxes
    idleTtlSeconds: "3600"
    capacityTotal: "1000"
    maxFileBytes: "10485760"
    defaultMemoryMb: "512"
    defaultCpuPercent: "100"
    defaultPidsMax: "256"
    defaultDiskQuotaMb: "0"
    diskQuotaPoolSizeGb: ""
    diskQuotaPoolPath: ""
    enableCgroups: "true"
    dockerStorageDriver: ""
    dockerInsecureRegistries: ""

  resources: {}
  podAnnotations: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
